name: Cartoes Expirados — Gerar Dataset
on:
  schedule:
    - cron: '0 12 * * 1-5'   # 09:00 BRT = 12:00 UTC, seg-sex
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install --quiet google-cloud-bigquery google-auth google-auth-httplib2 requests pandas db-dtypes
      - name: Gerar cartoes_dataset.json
        env:
          GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
        run: python scripts/generate_dataset.py
      - name: Commit cartoes_dataset.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f cartoes_dataset.json
          git diff --staged --quiet || git commit -m "data: cartoes expirados $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase origin main
          git push
