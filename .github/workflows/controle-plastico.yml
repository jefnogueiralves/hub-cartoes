name: Controle Plastico — Gerar Dataset

on:
  schedule:
    - cron: '0 12 * * 1-5'   # 09:00 BRT = 12:00 UTC, seg a sex
  workflow_dispatch:

concurrency:
  group: controle-plastico-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: |
          pip install --quiet \
            google-cloud-bigquery \
            db-dtypes \
            pandas \
            google-auth \
            google-auth-httplib2

      - name: Gerar plastico_dataset.json
        env:
          GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
        run: python controle-plastico/scripts/generate_dataset.py

      - name: Commit plastico_dataset.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f controle-plastico/plastico_dataset.json
          git diff --staged --quiet || git commit -m "data: controle plastico $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase origin main
          git push

      - name: Publicar dataset no Grid
        env:
          GRID_TOKEN: ${{ secrets.GRID_TOKEN }}
        run: |
          set -e
          DOC_ID="01KRPZ2TK8FA0Q9MJK2SRZBW2C"
          DATASET="plastico_data"
          # grid.adminml.com e publico (mesmo host usado pelo Playwright em
          # sincronizar_todos.yml); grid.melioffice.com so e alcancavel de
          # dentro da rede corporativa/VPN e dá timeout em runner publico.
          BASE="https://grid.adminml.com/api/v1/documents/$DOC_ID/datasets/$DATASET"
          AUTH="Authorization: Bearer $GRID_TOKEN"

          RESP=$(curl -s --max-time 30 -X POST "$BASE/upload-url" -H "$AUTH")
          echo "upload-url resp: $RESP"
          UPLOAD_URL=$(echo "$RESP" | python3 -c "import sys,json; print(json.load(sys.stdin)['upload_url'])")
          REVISION=$(echo "$RESP" | python3 -c "import sys,json; print(json.load(sys.stdin)['revision'])")

          curl -s --max-time 30 -X PUT "$UPLOAD_URL" -H "$AUTH" -H "Content-Type: application/json" --data-binary @controle-plastico/plastico_dataset.json

          PUB_RESP=$(curl -s --max-time 30 -X POST "$BASE/publish" -H "$AUTH" -H "Content-Type: application/json" -d "{\"revision\":\"$REVISION\"}")
          echo "publish resp: $PUB_RESP"
          echo "$PUB_RESP" | python3 -c "import sys,json; d=json.load(sys.stdin); exit(0 if d.get('published') else 1)"
          echo "OK: dataset publicado no Grid"

      - name: Resumo
        run: |
          echo "## Dashboard atualizado" >> $GITHUB_STEP_SUMMARY
          echo "**Grid:** https://grid.adminml.com/d/01KRPZ2TK8FA0Q9MJK2SRZBW2C/view" >> $GITHUB_STEP_SUMMARY
          echo "**Data:** $(date -u +'%d/%m/%Y %H:%M UTC')" >> $GITHUB_STEP_SUMMARY
