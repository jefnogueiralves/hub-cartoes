name: Controle de Plastico — Atualizar Dashboard

on:
  schedule:
    - cron: '0 12 * * 1-5'    # 09:00 BRT = 12:00 UTC, seg-sex
    - cron: '15 13 * * 1-5'   # 10:15 BRT = 13:15 UTC, seg-sex (segurança)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Instalar dependências
        run: |
          pip install --quiet \
            google-cloud-bigquery db-dtypes pandas google-auth google-auth-httplib2 requests

      - name: Atualizar dados e gerar HTML
        env:
          GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
          DASH_DIR: controle-plastico
        run: python controle-plastico/scripts/atualizar_dados_ci.py

      - name: Commit HTML no repo
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add controle-plastico/index.html
          git diff --staged --quiet || git commit -m "chore: controle plastico $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase origin main
          git push

      - name: Publicar no Grid
        env:
          GRID_API_TOKEN: ${{ secrets.GRID_API_TOKEN }}
          GRID_DOC_ID: "01KRPZ2TK8FA0Q9MJK2SRZBW2C"
        run: |
          echo "Publicando no Grid..."
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "https://grid.melioffice.com/api/v1/engine/run" \
            -H "Authorization: Bearer ${GRID_API_TOKEN}" \
            -F "config={\"skill_version\":\"3.6.5\",\"doc_id\":\"${GRID_DOC_ID}\"}" \
            -F "file=@controle-plastico/index.html")
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -1)
          echo "HTTP: $HTTP_CODE"
          echo "Response: $BODY"
          if [ "$HTTP_CODE" != "200" ] && [ "$HTTP_CODE" != "201" ]; then
            echo "ERRO: Grid retornou HTTP $HTTP_CODE"
            exit 1
          fi
          VERSION=$(echo "$BODY" | python3 -c "import json,sys; print(json.load(sys.stdin).get('version','?'))" 2>/dev/null || echo "?")
          echo "Grid atualizado! Versao: $VERSION"
          echo "URL: https://grid.adminml.com/d/${GRID_DOC_ID}/view"
