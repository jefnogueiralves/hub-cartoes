name: Controle de Plastico — Atualizar Dashboard

on:
  schedule:
    - cron: '0 12 * * 1-5'    # 09:00 BRT = 12:00 UTC, seg-sex
    - cron: '15 13 * * 1-5'   # 10:15 BRT = 13:15 UTC, seg-sex (segurança)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Instalar dependências
        run: |
          pip install --quiet \
            google-cloud-bigquery db-dtypes pandas google-auth google-auth-httplib2 requests

      - name: Atualizar dados e gerar HTML
        env:
          GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
          DASH_DIR: controle-plastico
        run: python controle-plastico/scripts/atualizar_dados_ci.py

      - name: Commit HTML no repo
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add controle-plastico/index.html
          git diff --staged --quiet || git commit -m "chore: controle plastico $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase origin main
          git push

      - name: Publicar no Grid
        env:
          GRID_TOKEN: ${{ secrets.GRID_TOKEN }}
        run: |
          python3 - << 'EOF'
          import requests, sys, os
          token  = os.environ["GRID_TOKEN"]
          doc_id = "01KRPZ2TK8FA0Q9MJK2SRZBW2C"
          bundle = "controle-plastico/index.html"
          with open(bundle, "rb") as f:
              data = f.read()
          print(f"Publicando {len(data)//1024}KB no Grid...")
          r = requests.post(
              "https://grid.melioffice.com/api/v1/engine/run",
              headers={"Authorization": f"Bearer {token}"},
              files={
                  "config": (None, f'{"skill_version":"3.6.5","doc_id":"{doc_id}"}'),
                  "file": (bundle, data, "text/html"),
              },
              timeout=300
          )
          if r.status_code == 200:
              print(f"Grid publicado! Versao: {r.json().get('version','?')}")
          else:
              print(f"Erro HTTP {r.status_code}: {r.text[:300]}")
              sys.exit(1)
          EOF

