name: Controle Plastico — Gerar Dataset

on:
  schedule:
    - cron: '0 12 * * 1-5'   # 09:00 BRT = 12:00 UTC, seg a sex
    - cron: '0 14 * * 1-5'   # 11:00 BRT = 14:00 UTC, seg a sex
    - cron: '0 16 * * 1-5'   # 13:00 BRT = 16:00 UTC, seg a sex
    - cron: '0 18 * * 1-5'   # 15:00 BRT = 18:00 UTC, seg a sex
    - cron: '0 21 * * 1-5'   # 18:00 BRT = 21:00 UTC, seg a sex
    - cron: '0 1 * * 2-6'    # 22:00 BRT = 01:00 UTC do dia seguinte, seg a sex (ter-sab em UTC)
  workflow_dispatch:

concurrency:
  group: controle-plastico-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: |
          pip install --quiet \
            google-cloud-bigquery \
            db-dtypes \
            pandas \
            google-auth \
            google-auth-httplib2

      - name: Gerar plastico_dataset.json
        env:
          GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
        run: python controle-plastico/scripts/generate_dataset.py

      - name: Commit plastico_dataset.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f controle-plastico/plastico_dataset.json
          git diff --staged --quiet || git commit -m "data: controle plastico $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase origin main
          git push

      - name: Gerar index.html atualizado
        env:
          GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
        # Sem GRID_SESSION_ID: o script so gera/grava o index.html localmente e
        # pula a publicacao no Grid (isso agora e feito pelo Verdi Flow, que le
        # este arquivo direto do repo via GitHub Contents API).
        run: python controle-plastico/scripts/atualizar_dados_ci.py

      - name: Commit index.html
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f controle-plastico/index.html
          git diff --staged --quiet || git commit -m "data: controle plastico index.html $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase origin main
          git push

      # NOTA (24/08/2026): tentei publicar via API Grid Dataset aqui (upload-url
      # + PUT + publish, com GRID_TOKEN como Bearer), mas o endpoint esta
      # protegido por Google IAP, que rejeitou com "Invalid IAP credentials:
      # Unable to parse JWT" -- GRID_TOKEN nao e um JWT valido pro IAP. Falta
      # descobrir o fluxo de autenticacao correto (provavelmente um identity
      # token do Google com audience especifica) antes de reativar este step.

      - name: Resumo
        run: |
          echo "## Dashboard atualizado" >> $GITHUB_STEP_SUMMARY
          echo "**Grid:** https://grid.adminml.com/d/01KRPZ2TK8FA0Q9MJK2SRZBW2C/view" >> $GITHUB_STEP_SUMMARY
          echo "**Data:** $(date -u +'%d/%m/%Y %H:%M UTC')" >> $GITHUB_STEP_SUMMARY
