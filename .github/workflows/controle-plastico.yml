name: Controle de Plastico — Atualizar Dashboard
on:
  schedule:
    - cron: '0 12 * * 1-5'   # 9h BRT = 12h UTC, seg a sex
  workflow_dispatch:
jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Instalar dependências
        run: |
          pip install --quiet \
            google-cloud-bigquery \
            db-dtypes \
            pandas \
            google-auth \
            google-auth-httplib2 \
            requests

      - name: Atualizar dados e gerar HTML
        env:
          GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
          DASH_DIR: controle-plastico
        run: python controle-plastico/scripts/atualizar_dados_ci.py

      - name: Commit HTML no repo
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add controle-plastico/index.html
          git diff --staged --quiet || git commit -m "chore: controle plastico $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push

      - name: Publicar no Grid via VerdiFlows
        env:
          VERDIFLOWS_WEBHOOK_URL: ${{ secrets.VERDIFLOWS_WEBHOOK_URL }}
        run: |
          FILE_URL="https://raw.githubusercontent.com/jefnogueiralves/hub-cartoes/main/controle-plastico/index.html"
          RESPONSE=$(curl -sf --max-time 180 -X POST "$VERDIFLOWS_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "{\"doc_id\":\"01KRPZ2TK8FA0Q9MJK2SRZBW2C\",\"file_url\":\"$FILE_URL\",\"nome\":\"Controle Plastico\"}")
          echo "VerdiFlows: $RESPONSE"

      - name: Resumo
        run: |
          echo "## Controle Plástico atualizado" >> $GITHUB_STEP_SUMMARY
          echo "| Campo | Valor |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| GRID | https://grid.adminml.com/d/01KRPZ2TK8FA0Q9MJK2SRZBW2C/view |" >> $GITHUB_STEP_SUMMARY
          echo "| **Data** | $(date -u +'%d/%m/%Y %H:%M UTC') |" >> $GITHUB_STEP_SUMMARY
