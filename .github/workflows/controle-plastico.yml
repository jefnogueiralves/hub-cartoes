name: Controle de Plastico — Atualizar Dashboard
on:
  schedule:
    - cron: '0 12 * * 1-5'   # 9h Brasilia = 12h UTC, seg a sex
  workflow_dispatch:
jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Instalar dependências
        run: |
          pip install --quiet \
            google-cloud-bigquery \
            db-dtypes \
            pandas \
            google-auth \
            google-auth-httplib2 \
            requests

      - name: Atualizar dados e gerar HTML
        env:
          GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
          DASH_DIR: controle-plastico
        run: python controle-plastico/scripts/atualizar_dados_ci.py

      - name: Publicar no Grid
        env:
          GRID_TOKEN: ${{ secrets.GRID_TOKEN }}
          GRID_DOC_ID: ${{ secrets.GRID_DOC_ID_PLASTICO }}
        run: |
          echo "Doc ID: $GRID_DOC_ID"
          echo "File size: $(wc -c < controle-plastico/index.html) bytes"
          RESPONSE=$(curl -s --max-time 120 -X POST "https://grid.melioffice.com/api/v1/engine/run" \
            -H "Authorization: Bearer $GRID_TOKEN" \
            -F "config={\"skill_version\":\"3.6.4\",\"doc_id\":\"$GRID_DOC_ID\"}" \
            -F "file=@controle-plastico/index.html;filename=index.html" \
            -w "\nHTTP_STATUS:%{http_code}")
          echo "Resposta completa:"
          echo "$RESPONSE"
          HTTP_CODE=$(echo "$RESPONSE" | grep -o 'HTTP_STATUS:[0-9]*' | cut -d: -f2)
          echo "HTTP Status: $HTTP_CODE"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "ERRO: status $HTTP_CODE"
            exit 1
          fi

      - name: Resumo
        run: |
          echo "## Controle Plastico atualizado" >> $GITHUB_STEP_SUMMARY
          echo "| Campo | Valor |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| GRID | https://grid.adminml.com/d/01KRPZ2TK8FA0Q9MJK2SRZBW2C/view |" >> $GITHUB_STEP_SUMMARY
          echo "| **Data** | $(date -u +'%d/%m/%Y %H:%M UTC') |" >> $GITHUB_STEP_SUMMARY
