name: Atualizar Cartões Expirados

on:
  schedule:
    - cron: '30 12 * * 1-5'   # 09:30 BRT (seg–sex)
  workflow_dispatch:

permissions:
  contents: write

env:
  GOOGLE_APPLICATION_CREDENTIALS: /home/runner/.config/gcloud/application_default_credentials.json

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          pip install --quiet \
            google-cloud-bigquery \
            google-cloud-storage \
            google-auth \
            requests \
            pandas \
            db-dtypes \
            jinja2

      - name: Configure GCP credentials
        run: |
          mkdir -p ~/.config/gcloud
          echo '${{ secrets.GCP_ADC_JSON }}' > $GOOGLE_APPLICATION_CREDENTIALS

      - name: Update data and generate HTML bundle
        run: python scripts/update_data.py

      - name: Commit bundle no repo
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add cartoes_expirados_bundle.html
          git diff --staged --quiet || git commit -m "chore: bundle cartoes expirados $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase origin main
          git push
