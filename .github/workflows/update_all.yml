name: Atualizar Cartões Expirados

on:
  schedule:
    - cron: '0 12 * * 1-5'    # 09:00 BRT = 12:00 UTC, seg-sex
    - cron: '15 13 * * 1-5'   # 10:15 BRT = 13:15 UTC, seg-sex (segurança)
  workflow_dispatch:

permissions:
  contents: write

env:
  GOOGLE_APPLICATION_CREDENTIALS: /home/runner/.config/gcloud/application_default_credentials.json

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --quiet \
            google-cloud-bigquery \
            google-cloud-storage \
            google-auth \
            requests \
            pandas \
            db-dtypes \
            jinja2

      - name: Configure GCP credentials
        run: |
          mkdir -p ~/.config/gcloud
          echo '${{ secrets.GCP_ADC_JSON }}' > $GOOGLE_APPLICATION_CREDENTIALS

      - name: Update data and generate HTML bundle
        run: |
          python scripts/update_data.py
          python - << 'EOF'
          import re, os
          from pathlib import Path
          from datetime import datetime

          BASE = Path(os.environ.get('GITHUB_WORKSPACE', '.'))
          data_js = (BASE / 'dashboard_data.js').read_text(encoding='utf-8')
          html    = (BASE / 'cartoes-expirados' / 'index.html').read_text(encoding='utf-8')

          pat = r'<script\s+src=["\']dashboard_data\.js["\'][^>]*>\s*</script>'
          inline = f'<script>\n{data_js}\n</script>'
          html = re.sub(pat, inline, html, flags=re.IGNORECASE)

          ts = datetime.now().strftime('%Y%m%d%H%M%S')
          html = html.replace('</head>', f'<meta name="cache-ts" content="{ts}">\n</head>', 1)

          out = BASE / 'cartoes_expirados_bundle.html'
          out.write_text(html, encoding='utf-8')
          size_kb = len(html.encode()) // 1024
          print(f'Bundle gerado: {size_kb} KB ({size_kb/1024:.1f} MB)')
          EOF

      - name: Commit bundle no repo
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add cartoes_expirados_bundle.html
          git diff --staged --quiet || git commit -m "chore: bundle cartoes expirados $(date -u +'%Y-%m-%d %H:%M UTC')"
          git checkout -- .
          git pull --rebase origin main
          git push


